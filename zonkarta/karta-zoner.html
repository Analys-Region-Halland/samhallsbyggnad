<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Hallands arbetsmarknadsregioner — zonkarta</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #f8f9f7; color: #2a3f36; overflow: hidden;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
    }
    #app { position: fixed; inset: 0; }
    #app > div { width: 100% !important; height: 100% !important; border-radius: 0 !important; }
    #app canvas { width: 100% !important; height: 100% !important; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #5a6f64; letter-spacing: 0.04em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="loading">Laddar data…</div>
  <div id="app"></div>
  <script type="module">
    import { zonkarta } from "./js/zonkarta.js";

    async function loadJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url}: ${r.status}`);
      return r.json();
    }

    // Kolla om vi är inbäddade (iframe) via URL-param
    const params = new URLSearchParams(location.search);
    const embedded = params.has("embed");

    async function render() {
      const [flode, lan, orter, ortEdges, fua, karnor, invanare, dagbefMap] = await Promise.all([
        loadJson("data/vagnat-flode.geojson"),
        loadJson("data/halland-lan.geojson"),
        loadJson("data/tatorter-halland.geojson"),
        loadJson("data/ort-edges.json"),
        loadJson("data/ort-fua.json").catch(() => ({})),
        loadJson("data/karnor.json").catch(() => ({})),
        loadJson("data/invanare.json").catch(() => ({})),
        loadJson("data/dagbef.json").catch(() => ({}))
      ]);

      const app = document.getElementById("app");
      const loading = document.getElementById("loading");
      let currentNode = null;

      function draw() {
        app.innerHTML = "";
        const isFullscreen = !!document.fullscreenElement;
        const collapsed = embedded && !isFullscreen;
        currentNode = zonkarta(flode, lan, orter, ortEdges, {
          width:  window.innerWidth,
          height: window.innerHeight,
          fua,
          karnor,
          invanare,
          dagbefMap,
          panelCollapsed: collapsed
        });
        app.appendChild(currentNode);
      }

      draw();
      loading.remove();

      // Fullscreen: rita om helt så projektionen centreras korrekt
      document.addEventListener("fullscreenchange", () => {
        clearTimeout(t);
        t = setTimeout(draw, 100);
      });

      let t;
      window.addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(draw, 150);
      });
    }

    render().catch(err => {
      document.getElementById("loading").textContent = "Fel vid laddning: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
